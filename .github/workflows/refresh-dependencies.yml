name: Refresh dependency locks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: refresh-dependency-locks
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install "poetry==2.2.1"

      - name: Refresh Python dependencies
        working-directory: sdks/python
        run: poetry update --no-interaction

      - name: Validate Python package
        working-directory: sdks/python
        run: |
          poetry check
          poetry run ruff format --check --config pyproject.toml .
          poetry run ruff check --config pyproject.toml .
          poetry run pytest -c pyproject.toml --cov-report=term-missing --cov=conftier tests/
          poetry build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Refresh Rust dependencies
        run: cargo update

      - name: Validate Rust package
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -- -D warnings
          cargo test --locked --verbose
          cargo package --locked --allow-dirty

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Refresh documentation dependencies
        working-directory: docs
        run: pnpm update --latest

      - name: Validate documentation build
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm run docs:build

      - name: Commit refreshed dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock sdks/python/poetry.lock docs/package.json docs/pnpm-lock.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Dependency files are already current."
            exit 0
          fi
          git commit -m "chore: refresh dependency lockfiles"
          git push
