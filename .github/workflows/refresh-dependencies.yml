name: Refresh dependency locks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: refresh-dependency-locks
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@11

      - name: Refresh documentation dependencies
        id: docs-update
        working-directory: docs
        run: |
          set +e
          pnpm update --latest --no-frozen-lockfile --reporter=append-only > ../.github/pnpm-update.txt 2>&1
          status=$?
          cat ../.github/pnpm-update.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save pnpm failure output
        if: steps.docs-update.outputs.status != '0'
        run: |
          git add .github/pnpm-update.txt
          git commit -m "chore: capture pnpm update failure"
          git push
          exit 1

      - name: Validate documentation build
        if: steps.docs-update.outputs.status == '0'
        working-directory: docs
        run: |
          rm -f ../.github/pnpm-update.txt
          pnpm install --frozen-lockfile
          pnpm run docs:build

      - name: Set up Python
        if: steps.docs-update.outputs.status == '0'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        if: steps.docs-update.outputs.status == '0'
        run: pip install "poetry==2.2.1"

      - name: Refresh Python dependencies
        if: steps.docs-update.outputs.status == '0'
        working-directory: sdks/python
        run: poetry update --no-interaction

      - name: Validate Python package
        if: steps.docs-update.outputs.status == '0'
        working-directory: sdks/python
        run: |
          poetry check
          poetry run ruff format --check --config pyproject.toml .
          poetry run ruff check --config pyproject.toml .
          poetry run pytest -c pyproject.toml --cov-report=term-missing --cov=conftier tests/
          poetry build

      - name: Set up Rust
        if: steps.docs-update.outputs.status == '0'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Refresh Rust dependencies
        if: steps.docs-update.outputs.status == '0'
        run: cargo update

      - name: Validate Rust package
        if: steps.docs-update.outputs.status == '0'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -- -D warnings
          cargo test --locked --verbose
          cargo package --locked --allow-dirty

      - name: Commit refreshed dependencies
        if: steps.docs-update.outputs.status == '0'
        run: |
          git add Cargo.lock sdks/python/poetry.lock docs/package.json docs/pnpm-lock.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Dependency files are already current."
            exit 0
          fi
          git commit -m "chore: refresh dependency lockfiles"
          git push
